# Optional paid variant. Review Render pricing before applying.
services:
  - type: web
    name: fuyuki-grail-war
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
    disk:
      name: grail-data
      mountPath: /app/data
      sizeGB: 1
